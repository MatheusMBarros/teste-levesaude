service: levesaude-agendamento
frameworkVersion: '3'
useDotenv: true
configValidationMode: error

provider:
  name: aws
  runtime: nodejs20.x
  region: sa-east-1
  stage: ${opt:stage, 'dev'}
  timeout: 6
  memorySize: 256
  environment:
    NODE_OPTIONS: --enable-source-maps
    # Triagem (D17, ADR-010/011). Padrão `anthropic`: sem chave, POST /triagem responde 503 e as
    # outras rotas seguem funcionando. `fake` roda sem chave (testes, e2e, execução local).
    TRIAGE_PROVIDER: ${env:TRIAGE_PROVIDER, 'anthropic'}
    TRIAGE_MODEL: ${env:TRIAGE_MODEL, 'claude-sonnet-5'}
    # Em produção a chave viria do SSM Parameter Store/Secrets Manager, não de variável em texto (ADR-009).
    ANTHROPIC_API_KEY: ${env:ANTHROPIC_API_KEY, ''}

package:
  individually: true

plugins:
  - serverless-esbuild
  - serverless-offline

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    keepNames: true
    target: node20
    platform: node
    format: cjs
    exclude: []
  serverless-offline:
    noPrependStageInUrl: true
    httpPort: 3000

functions:
  # GET /agendas, POST /agendamento e POST /triagem na MESMA função de propósito (D15, ADR-008, ADR-009):
  # Lambdas distintas não compartilham memória, o horário reservado precisa sumir do GET (D6) e a triagem
  # precisa sugerir horários que ainda estão livres. Em produção seria uma função por endpoint com estado
  # externo (ex.: DynamoDB).
  schedule:
    handler: src/interfaces/http/handlers/schedule-handler.handler
    # 20 s por causa da triagem (docs/regras/api.md): o adapter do LLM gasta no máximo 17 s no pior caso
    # (3 tentativas de 5 s + pausas, ADR-010). Custo aceito: /agendas e /agendamento herdam o mesmo teto.
    timeout: 20
    events:
      - http:
          path: agendas
          method: get
          cors: true
      - http:
          path: agendamento
          method: post
          cors: true
      - http:
          path: triagem
          method: post
          cors: true

resources:
  Resources:
    # Erros gerados pelo próprio API Gateway (rota inexistente, 403...) no formato { erro, mensagem } (D19).
    GatewayResponseDefault4XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseType: DEFAULT_4XX
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Content-Type: "'application/json; charset=utf-8'"
        ResponseTemplates:
          application/json: '{"erro":"Requisição não atendida","mensagem":"A rota ou o método solicitado não existe, ou a requisição foi recusada pelo gateway."}'
    # Rota inexistente: a AWS REST responde 403 "Missing Authentication Token" por padrão (o gateway
    # não distingue rota ausente de requisição sem assinatura). Sem autorizador IAM nesta API, esse
    # tipo só ocorre para rota/método inexistente, então vira 404 (D19). O serverless-offline não
    # emula GatewayResponses: localmente a rota inexistente devolve o 404 dele, fora do formato.
    GatewayResponseMissingAuthenticationToken:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseType: MISSING_AUTHENTICATION_TOKEN
        StatusCode: '404'
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Content-Type: "'application/json; charset=utf-8'"
        ResponseTemplates:
          application/json: '{"erro":"Rota não encontrada","mensagem":"A rota ou o método solicitado não existe."}'
    GatewayResponseDefault5XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseType: DEFAULT_5XX
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Content-Type: "'application/json; charset=utf-8'"
        ResponseTemplates:
          application/json: '{"erro":"Erro interno","mensagem":"Ocorreu um erro inesperado. Tente novamente mais tarde."}'
