service: levesaude-agendamento
frameworkVersion: '3'
useDotenv: true
configValidationMode: error

provider:
  name: aws
  runtime: nodejs20.x
  region: sa-east-1
  stage: ${opt:stage, 'dev'}
  timeout: 6
  memorySize: 256
  environment:
    NODE_OPTIONS: --enable-source-maps

package:
  individually: true

plugins:
  - serverless-esbuild
  - serverless-offline

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    keepNames: true
    target: node20
    platform: node
    format: cjs
    exclude: []
  serverless-offline:
    noPrependStageInUrl: true
    httpPort: 3000
